name: Linux tests

on: push

permissions:
  contents: read

jobs:
  test:
    # The installer tests use unprivileged Bubblewrap user and network namespaces.
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Diamond Cursor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Test installation and removal
        run: python3 linux/test/installer.py -v

      - name: Check out the keyd test dependency
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rvaiya/keyd
          ref: f33dca879a3f871ee2e0fa9c1efd6e8dabb21ed3 # v2.5.0
          path: .ci/keyd
          persist-credentials: false

      - name: Test diamond cursor bindings
        run: python3 linux/test/bindings.py .ci/keyd
