<svg class="demo-board" viewBox="0 0 656 266" role="presentation">
  <defs>
    <linearGradient id="demo-case-$method" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#263247"/><stop offset="1" stop-color="#192335"/>
    </linearGradient>
    <linearGradient id="demo-skin-$method" x1="0" y1="0" x2=".8" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#fbd6b4"/><stop offset=".65" stop-color="#e7b18c"/><stop offset="1" stop-color="#c98969"/>
    </linearGradient>
  </defs>
  <rect width="656" height="266" fill="url(#demo-case-$method)"/>
