<div class="docs-layout wrap">
  <nav class="docs-nav" aria-label="Documentation">
    <div class="docs-sidebar">
      <h2>Documentation</h2>
      $navigation
    </div>
    <details class="docs-menu">
      <summary>Browse docs</summary>
      $navigation
    </details>
  </nav>
  <main id="main" class="document" tabindex="-1">
    <nav class="breadcrumbs" aria-label="Breadcrumb">$breadcrumbs</nav>
    <header class="doc-head">
      <h1 id="$anchor">$heading</h1>
      <div class="prose doc-intro">$intro</div>
    </header>
    $contents
    <div class="reading prose">$body</div>
    $related
  </main>
</div>
