[ids]
*

[main]
# Give physical Left Ctrl its own layer for the Home and End bindings.
leftcontrol = layer(left_control)

[left_control:C]

[alt]
# Key names refer to physical US QWERTY positions.
i = up
j = left
k = down
l = right
u = pageup
m = pagedown
h = backspace
apostrophe = delete
semicolon = esc

[alt+left_control]
j = home
l = end
